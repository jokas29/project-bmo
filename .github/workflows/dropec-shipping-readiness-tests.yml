name: DropEC shipping readiness tests

on:
  push:
    branches:
      - feature/dropec-shipping-readiness
    paths:
      - 'dropec/shipping-readiness/**'
      - '.github/workflows/dropec-shipping-readiness-tests.yml'
      - '.github/workflows/dropec-shipping-preflight-b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test fail-closed shipping state transitions (no network or credentials)
        run: deno test --allow-read=dropec/shipping-readiness,.github/workflows/dropec-shipping-preflight-b.yml dropec/shipping-readiness/guard.test.ts dropec/shipping-readiness/source_contract.test.ts dropec/shipping-readiness/quote_policy.test.ts dropec/shipping-readiness/checkout_race.test.ts dropec/shipping-readiness/bridge_claims.test.ts dropec/shipping-readiness/preflight_source.test.ts
      - name: Typecheck shipping endpoint
        run: deno check dropec/shipping-readiness/index.ts dropec/shipping-readiness/preflight_index.ts
