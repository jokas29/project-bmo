name: DropEC Background Render

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Paused while Supabase service is restricted
        run: |
          echo "DropEC Background Render scheduled polling is temporarily paused."
          echo "Reason: Supabase Edge Functions are returning HTTP 402 before function execution."
          echo "No rendering, tracking heartbeat, finalizer or poster action is executed."
