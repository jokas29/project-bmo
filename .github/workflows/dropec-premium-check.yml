name: DropEC Premium — Security and Visual Compositor Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'creative-studio/premium/**'
      - 'creative-studio/index.html'
      - '.github/workflows/dropec-premium-gpu.yml'
      - '.github/workflows/dropec-premium-cloudflare-ai.yml'
      - '.github/workflows/dropec-premium-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify no GPU dependencies are needed by the CPU compositor
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 requests==2.32.5
          python -m unittest discover -s creative-studio/premium -p 'test_*.py' -v
          python -m py_compile creative-studio/premium/runner.py creative-studio/premium/space/app.py
      - name: Check staged UI JavaScript parsing and owner controls
        run: |
          node <<'JS'
          const fs = require('node:fs')
          const vm = require('node:vm')
          const html = fs.readFileSync('creative-studio/index.html','utf8')
          const script = html.match(/<script>([\s\S]*?)<\/script>/)
          if (!script) throw new Error('Missing UI script')
          new vm.Script(script[1])
          for (const id of ['premiumqueue','premiumrefresh','premiumstate','premiumpreviews','slides']) {
            if (!html.includes('id="'+id+'"')) throw new Error('Missing premium control: '+id)
          }
          for(const fn of ['queuePremium','adoptPremium','refreshPremium']) {
            if (!script[1].includes('function '+fn+'(')) throw new Error('Missing handler '+fn)
          }
          const free = fs.readFileSync('.github/workflows/dropec-premium-cloudflare-ai.yml','utf8')
          const ciPreflight = free.indexOf('name: Confirm FLUX.2 Klein 4B availability without inference')
          const ciClaim = free.indexOf('name: Lease one LOCKED private staging proposal')
          if (ciPreflight < 0 || ciClaim < 0 || ciPreflight >= ciClaim) {
            throw new Error('Cloudflare free model preflight MUST precede preview claim')
          }
          const claimBlock = free.slice(ciClaim,free.indexOf('name: Install pinned CPU',ciClaim))
          if (!claimBlock.includes("if: steps.preflight.outputs.ready == 'true'")) {
            throw new Error('Private premium queue claim is not gated by free model availability')
          }
          const compositor = fs.readFileSync('creative-studio/premium/compositor.py','utf8')
          if (compositor.includes('poster.alpha_composite(fitted') ||
              compositor.includes('dr.rounded_rectangle((72,panel_top')) {
            throw new Error('Premium must not paste the source advertisement over generated scene')
          }
          if (!compositor.includes('reference_mode=="conceptual"') ||
              !compositor.includes('IMAGEN ILUSTRATIVA') ||
              !compositor.includes('SubjectExtractionError')) {
            throw new Error('Conceptual labeling or fail-closed image extraction missing')
          }
          const theme = JSON.parse(fs.readFileSync('creative-studio/premium/editorial_theme.json','utf8'))
          if (theme.formato.ancho!==1080 || theme.formato.alto!==1350 ||
              theme.estilo.fondo!=='#FFFFFF' ||
              theme.estilo.colores.principal!=='#29340A' ||
              theme.estilo.colores.secundario!=='#ADE500' ||
              theme.textos.contacto.telefono!==null ||
              theme.textos.contacto.direccion!==null) {
            throw new Error('Approved DropEC JSON design or verified-contact safeguards changed')
          }
          const cloud = fs.readFileSync('creative-studio/premium/cloudflare_runner.py','utf8')
          if (!cloud.includes('source_photo(preview.get("original_url"))') ||
              !cloud.includes('classify_reference(original)')) {
            throw new Error('Cloudflare runner must support missing catalogue images')
          }
          const brief = fs.readFileSync('creative-studio/premium/creative_brief.py','utf8')
          if (!brief.includes('ENTIRE PHYSICAL PRODUCT') ||
              !brief.includes('AT LEAST 6% background clearance') ||
              !brief.includes('#E8E8E8') ||
              !brief.includes('NO split layout')) {
            throw new Error('AI must output complete isolated product, not a backdrop or branded ad')
          }
          if (!compositor.includes('_organic_shapes') ||
              !compositor.includes('_extract_subject') ||
              !compositor.includes('_fit_product') ||
              !compositor.includes('Image.alpha_composite') ||
              compositor.includes('ghost.text(') ||
              compositor.includes('PRICE_PANEL_TOP')) {
            throw new Error('JSON design needs organic shapes, alpha-cutout, subject forefront and no rigid card')
          }
          const cf = fs.readFileSync('.github/workflows/dropec-premium-cloudflare-ai.yml','utf8')
          const hf = fs.readFileSync('.github/workflows/dropec-premium-gpu.yml','utf8')
          if(!cf.includes("rembg[cpu]==2.0.86") ||
             !hf.includes("rembg[cpu]==2.0.86")) {
            throw new Error('Both free Premium runners must remove background on CPU')
          }
          if (!free.includes("cron: '*/15 * * * *'")) {
            throw new Error('Premium backlog no longer has timely automatic checks')
          }
          if (!html.includes('3 ideas ya preparadas') ||
              !html.includes('render_after') ||
              !html.includes('setInterval(')) {
            throw new Error('Idempotent queue/backoff visibility or automatic owner refresh missing')
          }
          const edge = fs.readFileSync('creative-studio/premium/edge/index.ts','utf8')
          if (!edge.includes('process_interval_minutes:15') ||
              !edge.includes('render_after,render_started_at')) {
            throw new Error('Private status endpoint missing estimated cadence or retry state')
          }
          for (const x of ['path.endsWith("/regenerate")','/rest/v1/dropec_premium_preview_versions','original_url:source','allowedProductImage(value: unknown): string | null']){
            if (!edge.includes(x)) throw new Error('Missing universal private staging invariant: '+x)
          }
          if (!edge.includes('dropec-premium-cloudflare-ai.yml@refs/heads/main')) {
            throw new Error('Cloudflare runner identity is missing from exact OIDC allowlist')
          }
          for(const x of ['jwtVerify','requireRunner','requireOwner','publishing_enabled:false','publication_locked:true','status:"uploaded"']){
            if (!edge.includes(x)) throw new Error('Missing Edge security invariant: '+x)
          }
          if (/sb_secret_|SUPABASE_SERVICE_ROLE_KEY\s*=\s*["'](?!["'])/.test(html)) {
            throw new Error('Secret exposed in public HTML')
          }
          console.log('Private premium queue and browser code parse successfully.')
          JS
      - name: Assert availability gate runs before private queue claim
        run: |
          node <<'JS'
          const fs = require('node:fs')
          const flow = fs.readFileSync('.github/workflows/dropec-premium-gpu.yml','utf8')
          const check = fs.readFileSync('creative-studio/premium/check_hf_space.py','utf8')
          const preflight = flow.indexOf('name: Verify private Space RUNNING on free ZeroGPU')
          const claim = flow.indexOf('name: Lease one exclusive premium preview')
          if (preflight === -1 || claim === -1 || preflight >= claim) {
            throw new Error('Free GPU verification must precede private queue claim')
          }
          const claimSection = flow.slice(claim,flow.indexOf('name: Install small CPU',claim))
          if (!claimSection.includes("if: steps.preflight.outputs.ready == 'true'")) {
            throw new Error('Queue claim is not conditioned on verified free GPU')
          }
          if (!check.includes('HTTPError') || !check.includes('ZERO_GPU = "zero-a10g"')) {
            throw new Error('Space preflight missing HTTP-error or free-hardware protection')
          }
          console.log('No Space / HTTP 402 / paid GPU cannot consume a queued preview.')
          JS
      - name: Type-check the staging-only Edge function
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check creative-studio/premium/edge/index.ts
