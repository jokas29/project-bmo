name: DropEC Order Tracking

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Paused while Supabase service is restricted
        run: |
          echo "DropEC Order Tracking scheduled polling is temporarily paused."
          echo "Reason: Supabase Edge Functions are returning HTTP 402 before function execution."
          echo "No orders are modified and no external fulfillment action is performed."
