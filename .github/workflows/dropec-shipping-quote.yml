name: DropEC Shipping Quote

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Paused while Supabase service is restricted
        run: |
          echo "DropEC Shipping Quote scheduled polling is temporarily paused."
          echo "Reason: Supabase Edge Functions are returning HTTP 402 before function execution."
          echo "No shipping quote or external provider action is executed."
