name: DropEC WordPress Wake

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dropec-wordpress-wake.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dropec-wordpress-wake
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake DropEC automation through a real browser
        shell: bash
        run: |
          set -euo pipefail

          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No Chromium/Chrome browser found on runner"
            exit 1
          fi

          PROFILE="$(mktemp -d)"
          HOME_URL="https://radarcommerce.byethost7.com/"
          WAKE_URL="https://radarcommerce.byethost7.com/wp-json/dropec/v1/wake"

          browse() {
            local url="$1"
            local out="$2"
            timeout 120 "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --user-data-dir="$PROFILE" \
              --virtual-time-budget=60000 \
              --dump-dom "$url" >"$out" 2>/tmp/dropec-chrome.log || true
          }

          browse "$HOME_URL" /tmp/dropec-home-1.html
          sleep 3
          browse "$HOME_URL" /tmp/dropec-home-2.html
          sleep 3
          browse "$WAKE_URL" /tmp/dropec-wake.html

          echo "Home bytes: $(wc -c </tmp/dropec-home-2.html 2>/dev/null || echo 0)"
          echo "Wake bytes: $(wc -c </tmp/dropec-wake.html 2>/dev/null || echo 0)"

          if grep -Eqi 'aes\.js|requires Javascript|__test' /tmp/dropec-wake.html; then
            echo "WAKE_CHALLENGE=yes"
            exit 1
          else
            echo "WAKE_CHALLENGE=no"
          fi

          if grep -q '"ok":true' /tmp/dropec-wake.html; then
            echo "WAKE_OK=yes"
          else
            echo "WAKE_OK=no"
            head -c 1000 /tmp/dropec-wake.html | tr '\n' ' ' || true
            echo
            exit 1
          fi

          head -c 1000 /tmp/dropec-wake.html | tr '\n' ' ' || true
          echo
          echo "HPOS order #63 verification"
