name: DropEC WordPress Wake

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dropec-wordpress-wake.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dropec-wordpress-wake
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wake WordPress and process one DropEC shipping quote
        shell: bash
        run: |
          set -euo pipefail

          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No Chromium/Chrome browser found on runner"
            exit 1
          fi

          PROFILE="$(mktemp -d)"
          HOME_URL="https://radarcommerce.byethost7.com/"
          WAKE_URL="https://radarcommerce.byethost7.com/wp-json/dropec/v1/wake"
          BRIDGE="https://kzwzputkwcpojevffjrm.supabase.co/functions/v1/dropec-shipping-bridge"

          browse() {
            local url="$1"
            local out="$2"
            timeout 120 "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --user-data-dir="$PROFILE" \
              --virtual-time-budget=60000 \
              --dump-dom "$url" >"$out" 2>/tmp/dropec-chrome.log || true
          }

          # Warm ByetHost and keep its anti-bot cookie in this browser profile.
          browse "$HOME_URL" /tmp/dropec-home-1.html
          sleep 2
          browse "$HOME_URL" /tmp/dropec-home-2.html
          sleep 2
          browse "$WAKE_URL" /tmp/dropec-wake.html

          echo "Home bytes: $(wc -c </tmp/dropec-home-2.html 2>/dev/null || echo 0)"
          echo "Wake bytes: $(wc -c </tmp/dropec-wake.html 2>/dev/null || echo 0)"

          if grep -Eqi 'aes\.js|requires Javascript|__test' /tmp/dropec-wake.html; then
            echo "WAKE_CHALLENGE=yes"
            exit 1
          fi

          if ! grep -q '"ok":true' /tmp/dropec-wake.html; then
            echo "WAKE_OK=no"
            head -c 800 /tmp/dropec-wake.html | tr '\n' ' ' || true
            echo
            exit 1
          fi
          echo "WAKE_OK=yes"

          # Short-lived GitHub identity. No permanent Supabase/GitHub secret.
          OIDC_TOKEN="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dropec-shipping" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC_TOKEN"

          HAS_JOB="$(curl -fsSL -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$BRIDGE/has-job")"

          if [ "$(printf '%s' "$HAS_JOB" | python3 -c 'import sys,json; print(str(bool(json.load(sys.stdin).get("has_job"))).lower())')" != "true" ]; then
            echo "SHIPPING_JOB=none"
            exit 0
          fi

          curl -fsSL -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$BRIDGE/pull" > /tmp/dropec-shipping-job.json

          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/dropec-shipping-job.json'))['job']
          open('/tmp/job-id','w').write(j['id'])
          open('/tmp/job-url','w').write(j['url'])
          open('/tmp/job-raw','w').write(j['raw'])
          open('/tmp/job-signature','w').write(j['signature'])
          PY

          JOB_ID="$(cat /tmp/job-id)"
          JOB_URL="$(cat /tmp/job-url)"
          echo "::add-mask::$(cat /tmp/job-signature)"

          # Open the already-warmed WordPress origin and execute the signed POST
          # from inside that real browser session.
          "$BROWSER" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir="$PROFILE" \
            --remote-debugging-port=9222 \
            --remote-allow-origins='*' \
            "$HOME_URL" >/tmp/dropec-cdp.out 2>/tmp/dropec-cdp.err &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:9222/json/list >/tmp/cdp-pages.json 2>/dev/null; then
              break
            fi
            sleep 1
          done

          python3 -m pip install -q websocket-client

          python3 - <<'PY'
          import json, time, urllib.request
          import websocket

          pages=json.load(urllib.request.urlopen('http://127.0.0.1:9222/json/list'))
          page=next((p for p in pages if p.get('type')=='page'), pages[0])
          ws=websocket.create_connection(page['webSocketDebuggerUrl'], timeout=120)
          url=open('/tmp/job-url').read()
          raw=open('/tmp/job-raw').read()
          sig=open('/tmp/job-signature').read()
          expr=f'''(async()=>{{
            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(),100000);
            try {{
              const r=await fetch({json.dumps(url)},{{
                method:'POST',
                headers:{{'Content-Type':'application/json','x-dropec-signature':{json.dumps(sig)}}},
                body:{json.dumps(raw)},
                credentials:'include',
                signal:controller.signal
              }});
              return {{status:r.status,text:await r.text()}};
            }} finally {{
              clearTimeout(timer);
            }}
          }})()'''
          ws.send(json.dumps({'id':1,'method':'Runtime.evaluate','params':{'expression':expr,'awaitPromise':True,'returnByValue':True}}))
          deadline=time.time()+115
          result=None
          while time.time()<deadline:
            msg=json.loads(ws.recv())
            if msg.get('id')==1:
              result=msg
              break
          ws.close()
          if not result:
            raise SystemExit('CDP response timeout')
          value=result.get('result',{}).get('result',{}).get('value')
          if not isinstance(value,dict):
            raise SystemExit('Invalid CDP result')
          json.dump(value,open('/tmp/quote-http.json','w'))
          PY

          kill "$CHROME_PID" 2>/dev/null || true
          trap - EXIT

          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/quote-http.json'))
          try:
            body=json.loads(h.get('text',''))
          except Exception:
            body={}
          if 200 <= int(h.get('status',0)) < 300 and body.get('ok'):
            out={
              'id':open('/tmp/job-id').read(),
              'ok':True,
              'shipping_amount':body.get('shipping_amount'),
              'carrier':body.get('carrier'),
              'origin_code':body.get('origin_code'),
              'destination_code':body.get('destination_code'),
              'options':body.get('options') or []
            }
          else:
            out={
              'id':open('/tmp/job-id').read(),
              'ok':False,
              'error':str(body.get('error') or ('http_'+str(h.get('status'))))[:400]
            }
          json.dump(out,open('/tmp/quote-complete.json','w'))
          PY

          curl -fsSL -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/quote-complete.json \
            "$BRIDGE/complete" >/tmp/quote-complete-response.json

          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/quote-complete-response.json'))
          print('SHIPPING_JOB=' + str(j.get('status') or ('retry' if j.get('retry') else 'done')))
          if j.get('shipping_amount') is not None:
            print('SHIPPING_AMOUNT=' + str(j['shipping_amount']))
          PY
