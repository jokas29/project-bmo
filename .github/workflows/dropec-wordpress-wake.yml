name: DropEC WordPress Wake

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dropec-wordpress-wake.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dropec-wordpress-wake
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake WordPress and run cron through a real browser
        shell: bash
        run: |
          set -euo pipefail

          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No Chromium/Chrome browser found on runner"
            exit 1
          fi

          PROFILE="$(mktemp -d)"
          HOME_URL="https://radarcommerce.byethost7.com/"
          CRON_URL="https://radarcommerce.byethost7.com/wp-cron.php?doing_wp_cron=$(date +%s)"

          browse() {
            local url="$1"
            local out="$2"
            timeout 90 "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --user-data-dir="$PROFILE" \
              --virtual-time-budget=15000 \
              --dump-dom "$url" >"$out" 2>/tmp/dropec-chrome.log || true
          }

          browse "$HOME_URL" /tmp/dropec-home-1.html
          sleep 3
          browse "$HOME_URL" /tmp/dropec-home-2.html
          sleep 3
          browse "$CRON_URL" /tmp/dropec-cron.html

          echo "Home bytes: $(wc -c </tmp/dropec-home-2.html 2>/dev/null || echo 0)"
          echo "Cron bytes: $(wc -c </tmp/dropec-cron.html 2>/dev/null || echo 0)"
          if grep -Eqi 'aes\.js|requires Javascript|__test' /tmp/dropec-cron.html; then
            echo "CRON_CHALLENGE=yes"
          else
            echo "CRON_CHALLENGE=no"
          fi
          head -c 500 /tmp/dropec-cron.html | tr '\n' ' ' || true
          echo
          echo "Verification run after initial cron scheduling"
