name: DropEC Premium — Cloudflare FLUX.2 Free Inference (staging only)

on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled runs may be delayed or skipped; a manual or code push also starts this private worker.
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dropec-premium-cloudflare-ai.yml'
      - 'creative-studio/premium/check_cloudflare_ai.py'
      - 'creative-studio/premium/edge/index.ts'
      - 'creative-studio/ingest/catalog-source.ts'
      - 'creative-studio/premium/cloudflare_runner.py'
      - 'creative-studio/premium/compositor.py'
      - 'creative-studio/premium/creative_brief.py'
      - 'creative-studio/premium/editorial_theme.json'
      - 'creative-studio/premium/install_display_font.sh'

permissions:
  contents: read
  id-token: write

concurrency:
  group: dropec-premium-free-inference
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ENDPOINT: https://ubxkqbnzdtgfvphwohzm.supabase.co/functions/v1/dropec-premium-scene
      DROPEC_CF_ACCOUNT_ID: ${{ vars.DROPEC_CF_ACCOUNT_ID }}
      DROPEC_CF_AI_TOKEN: ${{ secrets.DROPEC_CF_AI_TOKEN }}
    steps:
      - name: Skip unless account ID and scoped Workers AI token are configured
        id: config
        shell: bash
        run: |
          if [[ ! "$DROPEC_CF_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || [ -z "$DROPEC_CF_AI_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DropEC Premium Workers AI not configured: queue remains intact."
            echo "### Workers AI: not configured; no inference, no queue claim" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout staging compositor and free API runner
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm FLUX.2 Klein 4B availability without inference
        if: steps.config.outputs.configured == 'true'
        id: preflight
        run: |
          python3 creative-studio/premium/check_cloudflare_ai.py
          if ! grep -q '^ready=true$' "$GITHUB_OUTPUT"; then
            echo "::notice::Workers AI unavailable; preserve all queued previews."
            echo "### Workers AI: skipped due to missing/invalid access" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Obtain short-lived staging runner identity
        if: steps.preflight.outputs.ready == 'true'
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dropec-creative-premium"
          token="$(curl --fail-with-body --silent --show-error --max-time 20 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Import approved Woo products into the private Creative Studio queue
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          FEED: https://kzwzputkwcpojevffjrm.supabase.co/functions/v1/dropec-creative-feed
        run: |
          set -euo pipefail
          if curl --fail-with-body --silent --show-error --max-time 28 \
            -H "Authorization: Bearer $TOKEN" "$FEED" > /tmp/dropec-approved-catalog.json; then
            if curl --fail-with-body --silent --show-error --max-time 28 -X POST "$ENDPOINT/carousel/ingest" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data-binary @/tmp/dropec-approved-catalog.json > /tmp/dropec-ingest.json; then
              python3 - <<'PY'
          import json
          data=json.load(open('/tmp/dropec-ingest.json'))
          if data.get('ok') is not True or data.get('publishing_enabled') is not False:
              raise SystemExit('Catalog import did not fail closed')
          print('Private Woo catalog import:',data.get('action','unknown'))
          PY
            else
              echo "::warning::Import service unavailable; existing Premium queue continues."
            fi
          else
            echo "::warning::Read-only catalog unavailable; existing Premium queue continues."
          fi

      - name: Automatically prepare selected Premium products in private staging
        if: steps.preflight.outputs.ready == 'true'
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 -X POST "$ENDPOINT/carousel/auto-prepare" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{}' > /tmp/dropec-auto.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/dropec-auto.json'))
          if data.get("ok") is not True or data.get("publishing_enabled") is not False:
              raise SystemExit("Private Premium autopilot failed closed")
          print("Premium auto-prepare:",data.get("action","unknown"))
          PY

      - name: Lease one LOCKED private staging proposal
        if: steps.preflight.outputs.ready == 'true'
        id: claim
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 -X POST "$ENDPOINT/claim" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{}' > /tmp/dropec-claim.json
          # Cover alternatives have priority. Then finish explicitly requested
          # inner carousel slides with the SAME free provider + identity.
          if python3 -c 'import json;d=json.load(open("/tmp/dropec-claim.json"));exit(0 if d.get("processed") is False else 1)'; then
            curl --fail-with-body --silent --show-error --max-time 30 -X POST "$ENDPOINT/carousel/claim" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{}' > /tmp/dropec-claim.json
          fi
          python3 <<'PY'
          import json,os,re
          v=json.load(open('/tmp/dropec-claim.json'))
          if v.get('ok') is not True: raise SystemExit("Staging claim rejected")
          done=v.get('processed') is True
          if done and (v.get('publication_locked') is not True or not re.fullmatch(r'[0-9a-f-]{36}',v.get('preview_id',''))):
              raise SystemExit("Invalid private preview identity or publication lock")
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write("processed="+("true" if done else "false")+"\n")
              if done:
                  output.write("preview_id="+v['preview_id']+"\n")
                  output.write("carousel="+("true" if v.get("carousel") is True else "false")+"\n")
          print("Leased locked "+("carousel slide" if v.get("carousel") else "cover proposal") if done else "Nothing to generate; no AI inference used")
          PY

      - name: Install pinned open-license Anton display typography
        if: steps.claim.outputs.processed == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check --no-input Pillow==12.1.0
          bash creative-studio/premium/install_display_font.sh

      - name: Install pinned CPU compositor dependencies
        if: steps.claim.outputs.processed == 'true'
        run: python3 -m pip install --disable-pip-version-check --no-input Pillow==12.1.0 requests==2.32.5 'rembg[cpu]==2.0.86'

      - name: Generate one real FLUX.2 scene and exact-text JPEG
        if: steps.claim.outputs.processed == 'true'
        id: generate
        run: |
          python3 creative-studio/premium/cloudflare_runner.py \
            --claim /tmp/dropec-claim.json --output /tmp/dropec-preview.jpg \
            --reference-mode-output /tmp/dropec-reference-mode.txt 2>/tmp/dropec-gpu-error.log

      - name: Save to private Supabase Storage (never Meta)
        if: steps.generate.outcome == 'success'
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          PREVIEW_ID: ${{ steps.claim.outputs.preview_id }}
        run: |
          set -euo pipefail
          endpoint="$ENDPOINT/complete?preview_id=$PREVIEW_ID"
          if [ "${{ steps.claim.outputs.carousel }}" = "true" ]; then
            endpoint="$ENDPOINT/carousel/complete?slide_id=$PREVIEW_ID"
          fi
          curl --fail-with-body --silent --show-error --max-time 50 -X POST "$endpoint" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: image/jpeg" \
            -H "X-DropEC-Reference-Mode: $(cat /tmp/dropec-reference-mode.txt)" \
            --data-binary @/tmp/dropec-preview.jpg > /tmp/dropec-complete.json
          python3 -c 'import json;assert json.load(open("/tmp/dropec-complete.json"))["status"] in ("ready","uploaded");print("Private premium image stored; never published")'

      - name: Record safe retry failure without publishing
        if: failure() && steps.claim.outputs.processed == 'true'
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          PREVIEW_ID: ${{ steps.claim.outputs.preview_id }}
        run: |
          python3 <<'PY'
          import json,os
          try: message=open('/tmp/dropec-gpu-error.log').read().strip().splitlines()[-1][:220]
          except Exception: message='Free AI unavailable or private staging upload failure'
          json.dump({'preview_id':os.environ['PREVIEW_ID'],'error':message},open('/tmp/dropec-error.json','w'))
          PY
          endpoint="$ENDPOINT/failed"
          if [ "${{ steps.claim.outputs.carousel }}" = "true" ]; then
            endpoint="$ENDPOINT/carousel/failed"
            python3 - <<'PY'
          import json
          path='/tmp/dropec-error.json'
          data=json.load(open(path))
          data['slide_id']=data.pop('preview_id')
          json.dump(data,open(path,'w'))
          PY
          fi
          curl --silent --show-error --max-time 25 -X POST "$endpoint" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data-binary @/tmp/dropec-error.json || true
