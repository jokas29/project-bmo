name: DropEC Dropi MCP contract tests

on:
  push:
    branches:
      - feature/dropec-dropi-mcp-readonly
    paths:
      - 'dropec/mcp-readonly/**'
      - '.github/workflows/dropec-mcp-contract-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-readonly-tests:
    name: Offline MCP read-only contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Offline tests — no Dropi tokens, credentials, or network permissions
        run: deno test dropec/mcp-readonly/core.test.ts dropec/mcp-readonly/oauth_protocol.test.ts dropec/mcp-readonly/privacy.test.ts
      - name: Typecheck OAuth callback (no invocation, no provider credentials)
        run: deno check dropec/mcp-readonly/oauth_index.ts dropec/mcp-readonly/index.ts
